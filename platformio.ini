; ONE board: ESP32-S3 N16R8 (16 MB QIO flash + 8 MB OPI PSRAM) driving a
; 3.5" 480x320 ST7796S. The classic-ESP32 (v1) env was retired on 2026-11-01:
; that device is dismantled and its receiver lives in this one.
;
; The shape is kept: a [common] block plus one [env:] per board, selected with
; -e / PIOENV (default in the Makefile). A second variant later = another env
; block and another display header, not a refactor.
[common]
build_flags =
  -DUSER_SETUP_LOADED
  -DTFT_RGB_ORDER=TFT_BGR
lib_deps =
  bodmer/TFT_eSPI
  mikalhart/TinyGPSPlus
  bblanchon/ArduinoJson@^6.21.1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:esp32s3]
board = esp32-s3-devkitc-1
; N16R8: 16 MB QIO flash + 8 MB OPI PSRAM, dual-OTA layout
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
; The S3's only USB is the native CDC/JTAG port: without this, Serial goes to
; the (unconnected) UART0 pins and the portal /serial log stays empty.
; USE_FSPI_PORT is REQUIRED on the S3: TFT_eSPI's S3 path sets
; SPI_PORT=FSPI=1, and IDF's REG_SPI_BASE(i) is 0 for i<2, so the very first
; writecommand() stores to address 0x10 and panics (StoreProhibited,
; EXCVADDR 0x10). Forcing port 2 selects GPSPI2, which is the bus the SPI
; object uses. Must stay until TFT_eSPI grows an S3 fix of its own.
build_flags =
  ${common.build_flags}
  -include include/User_Setup.h
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DUSE_FSPI_PORT
upload_speed = 921600
