; Two hardware variants, ONE shared src/.
;   esp32dev = v1  (classic ESP32, ST7789 240x320)  <- the device in the field
;   esp32s3  = v2  (ESP32-S3 N16R8, 3.5" 320x480 TFT)
; Choose the buildchain with -e / PIOENV:  make compile PIOENV=esp32s3
; Per-variant differences are the BOARD/flash config, the pin map
; (include/board_pins.h, selected by -DDEVICE_VARIANT_V2) and the DISPLAY
; setup header (-include ...). src/ itself is shared by both.
; v2 still builds the v1 panel config until the 3.5" panel is wired and the
; 320x480 layout port lands (screen_race.cpp et al. hardcode a 320x240 frame).
[common]
build_flags =
  -DUSER_SETUP_LOADED
  -DTFT_RGB_ORDER=TFT_BGR
lib_deps =
  bodmer/TFT_eSPI
  mikalhart/TinyGPSPlus
  bblanchon/ArduinoJson@^6.21.1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:esp32dev]
board = esp32dev
upload_speed = 115200
build_flags = ${common.build_flags} -include include/User_Setup.h

[env:esp32s3]
board = esp32-s3-devkitc-1
; N16R8: 16 MB QIO flash + 8 MB OPI PSRAM, dual-OTA layout
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
; The S3's only USB is the native CDC/JTAG port: without this, Serial goes to
; the (unconnected) UART0 pins and the portal /serial log stays empty.
; USE_FSPI_PORT is REQUIRED on the S3: TFT_eSPI's S3 path sets
; SPI_PORT=FSPI=1, and IDF's REG_SPI_BASE(i) is 0 for i<2, so the very first
; writecommand() stores to address 0x10 and panics (StoreProhibited,
; EXCVADDR 0x10). Forcing port 2 selects GPSPI2, which is the bus the SPI
; object uses. Must stay until TFT_eSPI grows an S3 fix of its own.
build_flags =
  ${common.build_flags}
  -include include/User_Setup.h
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DUSE_FSPI_PORT
  -DDEVICE_VARIANT_V2
upload_speed = 921600
