[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
  -DUSER_SETUP_LOADED
  -include include/User_Setup.h
  -DTFT_RGB_ORDER=TFT_BGR
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bodmer/TFT_eSPI
  mikalhart/TinyGPSPlus
  bblanchon/ArduinoJson@^6.21.1

# Wokwi simulator build: same firmware + WOKWI_SIM shims (virtual WiFi,
# forced mock GPS). Build with `make sim`, run with the Wokwi VS Code
# extension. Never flashed to hardware, never OTA-published.
[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
  -DUSER_SETUP_LOADED
  -include include/User_Setup.h
  -DTFT_RGB_ORDER=TFT_BGR
  -DWOKWI_SIM
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bodmer/TFT_eSPI
  mikalhart/TinyGPSPlus
  bblanchon/ArduinoJson@^6.21.1